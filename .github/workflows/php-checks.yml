name: PHP checks

on:
  push:
    branches: [main, deploy/koyeb]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: PHP syntax and database tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-postgres-password
          POSTGRES_DB: php_bot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d php_bot_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: php_bot_test
      DB_USER: postgres
      DB_PASSWORD: test-postgres-password
      DB_SSL_MODE: disabled
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: curl, pdo_pgsql
          coverage: none

      - name: Check PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find src public bin tests database/migrations -type f -name '*.php' -print0)

      - name: Run Phase 1 smoke tests
        run: php tests/phase1_smoke.php

      - name: Run Phase 2 database tests
        run: php tests/phase2_database.php

      - name: Run Phase 3 authorization tests
        run: php tests/phase3_security.php
